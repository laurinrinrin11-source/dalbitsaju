<body>
<div class="app-shell">

  <div class="hero">
    <div class="hero-content">
      <div class="hero-eyebrow">달빛사주</div>
      <h1 class="font-serifkr">조금 더 자세히 알려주세요</h1>
    </div>
  </div>

  <div class="step-indicator">
    <span class="step-dot" style="opacity:0.4;"></span><span style="opacity:0.5;">기본정보</span>
    <span style="opacity:0.4;">──</span>
    <span class="step-dot"></span><span>선택정보</span>
  </div>

  <div class="intro-box">
    <p>여기서부터는 모두 선택 입력이에요.<br/>
    정보를 더 자세히 적어주실수록,<br/>
    더 정확하고 깊이 있는 풀이를 받으실 수 있어요.</p>
  </div>

  <form id="optionalInfoForm">

    <div class="field">
      <label class="field-label">결혼 여부</label>
      <div class="toggle-row">
        <div class="toggle-btn" data-group="marital" data-value="single">미혼</div>
        <div class="toggle-btn" data-group="marital" data-value="married">기혼</div>
        <div class="toggle-btn" data-group="marital" data-value="divorced">이혼/사별</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">가족관계</label>
      <textarea id="family" placeholder="예시: 남편, 시어머니, 시아버지, 아들, 부모님과 남동생, 연인 등
(생년월일은 적지 마시고 관계만 적어주세요)"></textarea>
    </div>

    <div class="field">
      <label class="field-label">이전 사주 상담 경험</label>
      <textarea id="pastExperience" placeholder="이전에 사주를 본 적이 있다면, 아쉬웠던 점이나 잘 맞았던 부분, 틀렸던 부분 등을 자유롭게 적어주세요"></textarea>
    </div>

    <div class="field">
      <label class="field-label">현재 상황</label>
      <textarea id="currentSituation" placeholder="재정 상황, 주변 환경, 심적인 상황 등 지금 본인의 상황과 관련된 것이라면 무엇이든 자유롭게 적어주세요"></textarea>
    </div>

    <button type="submit" class="next-btn" id="submitBtn">제출하기</button>
    <div class="step-nav-row">
      <a href="기본정보.html" class="back-link">&#8592; 이전 단계로 돌아가기</a>
      <button type="button" class="skip-link" id="skipBtn">이 단계는 건너뛸게요</button>
    </div>
  </form>

</div>

<script>
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      document.querySelectorAll(`.toggle-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const WEB3FORMS_ACCESS_KEY = '27c296b8-e961-4361-a752-ae1316ab81ca';

  async function sendApplicationAndProceed() {
    const submitBtn = document.getElementById('submitBtn');
    const skipBtn = document.getElementById('skipBtn');
    submitBtn.disabled = true;
    skipBtn.disabled = true;
    const originalText = submitBtn.textContent;
    submitBtn.textContent = '전송 중...';

    let basicInfo = {};
    try {
      basicInfo = JSON.parse(localStorage.getItem('dalbitBasicInfo') || '{}');
    } catch (e) {}

    const maritalSelected = document.querySelector('.toggle-btn[data-group="marital"].active');
    const family = document.getElementById('family').value.trim();
    const pastExperience = document.getElementById('pastExperience').value.trim();
    const currentSituation = document.getElementById('currentSituation').value.trim();
    const compatSelected = localStorage.getItem('dalbitAddonCompat') === '1';

    const payload = {
      access_key: WEB3FORMS_ACCESS_KEY,
      subject: `[${basicInfo.orderId || '번호없음'}] 달빛사주 신청 - ${basicInfo.name || '이름없음'}님`,
      from_name: '달빛사주 웹사이트',
      '주문번호': basicInfo.orderId || '',
      '이름': basicInfo.name || '',
      '생년월일': basicInfo.birthDate || '',
      '성별': basicInfo.gender || '',
      '양력_음력': basicInfo.calType || '',
      '출생국가': basicInfo.country || '',
      '출생시간': basicInfo.birthTime || '',
      '자유질문1': basicInfo.question1 || '',
      '자유질문2': basicInfo.question2 || '',
      'email': basicInfo.email || '',
      '결혼여부': maritalSelected ? maritalSelected.textContent.trim() : '',
      '가족관계': family,
      '이전_사주_상담_경험': pastExperience,
      '현재_상황': currentSituation,
      '궁합분석_추가': compatSelected ? '선택함 (+10,000원)' : '선택 안 함',
    };

    if (compatSelected) {
      payload['상대방_성함'] = basicInfo.partnerName || '';
      payload['상대방_성별'] = basicInfo.partnerGender || '';
      payload['상대방_생년월일'] = basicInfo.partnerBirthDate || '';
      payload['상대방_양력_음력'] = basicInfo.partnerCalType || '';
      payload['상대방_출생시간'] = basicInfo.partnerBirthTime || '';
    }

    try {
      await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (err) {
      // 전송 실패해도 고객 흐름은 막지 않음
      console.error('신청 정보 전송 실패:', err);
    }

    location.href = '접수완료.html';
  }

  document.getElementById('optionalInfoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    sendApplicationAndProceed();
  });
  document.getElementById('skipBtn').addEventListener('click', () => {
    sendApplicationAndProceed();
  });
</script>
</body>
</html>
