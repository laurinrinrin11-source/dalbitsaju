    text-shadow:0 2px 16px rgba(217,184,114,0.25);
  }

    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:20px 0 4px; font-size:0.78rem; color:#A9A6C4; letter-spacing:0.04em;
  }
  .step-dot{ width:7px; height:7px; border-radius:50%; background:#D9B872; }
  .step-dot.inactive{ background:rgba(217,184,114,0.25); }

  form{ padding:24px 22px 0; }

  .field{ margin-bottom:22px; }
  .field-label{
    display:block; font-family:'Noto Serif KR', serif; font-weight:700;
    font-size:0.92rem; color:#F3D9A0; margin-bottom:9px; letter-spacing:0.02em;
  }
  .field-hint{ font-size:0.76rem; color:#8f97b8; margin-top:6px; line-height:1.6; }

  input[type="text"], input[type="date"], input[type="time"], input[type="email"], textarea{
    width:100%; background:rgba(27,35,64,0.55); backdrop-filter:blur(6px);
    border:1px solid rgba(217,184,114,0.28); border-radius:12px;
    padding:12px 14px; color:#F3EEDD; font-size:0.9rem; font-family:'Noto Sans KR', sans-serif;
    outline:none; transition:border-color .15s;
  }
  input::placeholder, textarea::placeholder{ color:#6b7191; }
  input:focus, textarea:focus{ border-color:#D9B872; }
  textarea{ resize:vertical; min-height:70px; line-height:1.6; }

  .toggle-row{ display:flex; gap:10px; }
  .toggle-btn{
    flex:1; text-align:center; padding:11px 0; border-radius:12px; cursor:pointer;
    background:rgba(27,35,64,0.55); border:1px solid rgba(217,184,114,0.28);
    color:#C9C4DD; font-size:0.88rem; font-weight:700; transition:all .15s;
  }
  .toggle-btn.active{
    background:linear-gradient(180deg, #FBEFCF, #D9B872); color:#2A1D06;
    border-color:#D9B872; box-shadow:0 0 12px rgba(217,184,114,0.4);
  }

  .time-row{ display:flex; gap:10px; align-items:stretch; }
  .time-row input[type="time"]{ flex:1; }
  .time-unknown-btn{
    flex:none; padding:0 16px; border-radius:12px; cursor:pointer;
    background:rgba(27,35,64,0.55); border:1px solid rgba(217,184,114,0.28);
    color:#C9C4DD; font-size:0.85rem; font-weight:700; white-space:nowrap;
  }
  .time-unknown-btn.active{
    background:linear-gradient(180deg, #FBEFCF, #D9B872); color:#2A1D06;
    border-color:#D9B872; box-shadow:0 0 12px rgba(217,184,114,0.4);
  }

  .next-btn{
    display:block; width:100%; margin-top:8px; font-weight:800; font-size:1rem; padding:16px 0;
    border-radius:999px; text-decoration:none; letter-spacing:0.02em; text-align:center;
    font-family:'Noto Serif KR', serif; color:#2A1D06; border:none; cursor:pointer;
    background:linear-gradient(180deg, #FBEFCF, #D9B872);
    box-shadow:0 0 24px rgba(217,184,114,0.45), 0 4px 12px rgba(0,0,0,0.35);
  }
  .next-btn:active{ transform:scale(0.99); }

  .back-link{
    display:block; text-align:center; margin-top:14px; color:#8f97b8;
    font-size:0.82rem; text-decoration:none; font-family:'Noto Sans KR', sans-serif;
  }

  .error-text{ color:#FF9C82; font-size:0.78rem; margin-top:8px; display:none; }

  /* 궁합분석 상대방 정보 (붉은 계열로 구분) */
  .compat-section{
    margin:26px 0 22px; padding:18px 16px; border-radius:16px;
    background:rgba(166,52,42,0.08); border:1px solid rgba(255,157,130,0.35);
  }
  .compat-section-title{
    font-family:'Noto Serif KR', serif; font-weight:900; font-size:1rem;
    color:#FFB89E; margin:0 0 6px;
  }
  .compat-section-note{
    font-size:0.78rem; color:#FF9C82; margin:0 0 16px; line-height:1.6;
  }
  .compat-section .field-label{ color:#FFB89E; }
  .compat-section input[type="text"], .compat-section input[type="date"], .compat-section input[type="time"]{
    border-color:rgba(255,157,130,0.35);
  }
  .compat-section input:focus{ border-color:#FF9C82; }
  .compat-section .toggle-btn{ border-color:rgba(255,157,130,0.35); }
  .compat-section .toggle-btn.active{
    background:linear-gradient(180deg,#FFD9C7,#A6342A); color:#3a1208;
    border-color:#A6342A; box-shadow:0 0 12px rgba(166,52,42,0.4);
  }
  .compat-section .time-unknown-btn{ border-color:rgba(255,157,130,0.35); }
  .compat-section .time-unknown-btn.active{
    background:linear-gradient(180deg,#FFD9C7,#A6342A); color:#3a1208;
    border-color:#A6342A; box-shadow:0 0 12px rgba(166,52,42,0.4);
  }
</style>

<body>
<div class="app-shell">

  <div class="hero">
    <div class="hero-content">
      <div class="hero-eyebrow">달빛사주</div>
      <h1 class="font-serifkr">정보를 입력해주세요</h1>
    </div>
  </div>

  <div class="step-indicator">
    <span class="step-dot"></span><span>기본정보</span>
    <span style="opacity:0.4;">──</span>
    <span class="step-dot inactive"></span><span style="opacity:0.6;">선택정보</span>
  </div>

  <form id="basicInfoForm">

    <div class="field">
      <label class="field-label">성함</label>
      <input type="text" id="name" placeholder="이름을 입력해주세요" />
    </div>

    <div class="field">
      <label class="field-label">성별</label>
      <div class="toggle-row">
        <div class="toggle-btn" data-group="gender" data-value="male">남성</div>
        <div class="toggle-btn" data-group="gender" data-value="female">여성</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">생년월일</label>
      <input type="date" id="birthDate" />
    </div>

    <div class="field">
      <label class="field-label">양력 / 음력</label>
      <div class="toggle-row">
        <div class="toggle-btn" data-group="calType" data-value="solar">양력</div>
        <div class="toggle-btn" data-group="calType" data-value="lunar">음력</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">출생국가</label>
      <div class="toggle-row">
        <div class="toggle-btn" data-group="country" data-value="kr">대한민국</div>
        <div class="toggle-btn" data-group="country" data-value="etc">기타</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">출생시간</label>
      <div class="time-row">
        <input type="time" id="birthTime" />
        <div class="time-unknown-btn" id="timeUnknownBtn">시간 모름</div>
      </div>
      <p class="field-hint">출생시간을 모르시면 '시간 모름' 버튼을 눌러주세요.<br/>시간을 몰라도 충분히 구체적인 분석이 가능합니다.</p>
    </div>

    <div class="field">
      <label class="field-label">자유 질문 1</label>
      <textarea id="question1" placeholder="가장 궁금하신 점을 편하게 적어주세요"></textarea>
    </div>

    <div class="field">
      <label class="field-label">자유 질문 2</label>
      <textarea id="question2" placeholder="궁금하신 점을 하나 더 적어주세요"></textarea>
    </div>

    <div class="field">
      <label class="field-label">풀이집을 받아보실 이메일 주소</label>
      <input type="email" id="email" placeholder="example@email.com" />
    </div>

    <div class="compat-section" id="compatSection" style="display:none;">
      <div class="compat-section-title">궁합분석 상대방 정보</div>
      <div class="compat-section-note">※ 궁합분석을 선택하신 경우에만 작성해주세요</div>

      <div class="field">
        <label class="field-label">상대방 성함</label>
        <input type="text" id="partnerName" placeholder="상대방 이름을 입력해주세요" />
      </div>

      <div class="field">
        <label class="field-label">상대방 성별</label>
        <div class="toggle-row">
          <div class="toggle-btn" data-group="partnerGender" data-value="male">남성</div>
          <div class="toggle-btn" data-group="partnerGender" data-value="female">여성</div>
        </div>
      </div>

      <div class="field">
        <label class="field-label">상대방 생년월일</label>
        <input type="date" id="partnerBirthDate" />
      </div>

      <div class="field">
        <label class="field-label">상대방 양력 / 음력</label>
        <div class="toggle-row">
          <div class="toggle-btn" data-group="partnerCalType" data-value="solar">양력</div>
          <div class="toggle-btn" data-group="partnerCalType" data-value="lunar">음력</div>
        </div>
      </div>

      <div class="field" style="margin-bottom:0;">
        <label class="field-label">상대방 출생시간</label>
        <div class="time-row">
          <input type="time" id="partnerBirthTime" />
          <div class="time-unknown-btn" id="partnerTimeUnknownBtn">시간 모름</div>
        </div>
      </div>
    </div>

    <p class="error-text" id="formError">필수 항목을 확인해주세요.</p>

    <button type="submit" class="next-btn">다음 단계</button>
    <a href="report-contents.html" class="back-link">&#8592; 이전 페이지로 돌아가기</a>
  </form>

</div>

<script>
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const group = btn.dataset.group;
      document.querySelectorAll(`.toggle-btn[data-group="${group}"]`).forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  const timeUnknownBtn = document.getElementById('timeUnknownBtn');
  const birthTimeInput = document.getElementById('birthTime');
  timeUnknownBtn.addEventListener('click', () => {
    const nowActive = timeUnknownBtn.classList.toggle('active');
    birthTimeInput.disabled = nowActive;
    birthTimeInput.value = nowActive ? '' : birthTimeInput.value;
    birthTimeInput.style.opacity = nowActive ? '0.4' : '1';
  });

  const partnerTimeUnknownBtn = document.getElementById('partnerTimeUnknownBtn');
  const partnerBirthTimeInput = document.getElementById('partnerBirthTime');
  partnerTimeUnknownBtn.addEventListener('click', () => {
    const nowActive = partnerTimeUnknownBtn.classList.toggle('active');
    partnerBirthTimeInput.disabled = nowActive;
    partnerBirthTimeInput.value = nowActive ? '' : partnerBirthTimeInput.value;
    partnerBirthTimeInput.style.opacity = nowActive ? '0.4' : '1';
  });

  // 궁합분석을 선택한 경우에만 상대방 정보 섹션을 보여줌
  const compatSelected = localStorage.getItem('dalbitAddonCompat') === '1';
  document.getElementById('compatSection').style.display = compatSelected ? 'block' : 'none';

  document.getElementById('basicInfoForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const birthDate = document.getElementById('birthDate').value;
    const genderSelected = document.querySelector('.toggle-btn[data-group="gender"].active');
    const calTypeSelected = document.querySelector('.toggle-btn[data-group="calType"].active');
    const countrySelected = document.querySelector('.toggle-btn[data-group="country"].active');
    const errorBox = document.getElementById('formError');

    if (!name || !birthDate || !genderSelected || !calTypeSelected || !countrySelected) {
      errorBox.style.display = 'block';
      return;
    }
    errorBox.style.display = 'none';

    const basicInfo = {
      name: name,
      birthDate: birthDate,
      gender: genderSelected.textContent.trim(),
      calType: calTypeSelected.textContent.trim(),
      country: countrySelected.textContent.trim(),
      birthTime: birthTimeInput.value || (timeUnknownBtn.classList.contains('active') ? '시간 모름' : ''),
      question1: document.getElementById('question1').value.trim(),
      question2: document.getElementById('question2').value.trim(),
      email: document.getElementById('email').value.trim(),
    };

    if (compatSelected) {
      const partnerGenderSelected = document.querySelector('.toggle-btn[data-group="partnerGender"].active');
      const partnerCalTypeSelected = document.querySelector('.toggle-btn[data-group="partnerCalType"].active');
      basicInfo.partnerName = document.getElementById('partnerName').value.trim();
      basicInfo.partnerGender = partnerGenderSelected ? partnerGenderSelected.textContent.trim() : '';
      basicInfo.partnerBirthDate = document.getElementById('partnerBirthDate').value;
      basicInfo.partnerCalType = partnerCalTypeSelected ? partnerCalTypeSelected.textContent.trim() : '';
      basicInfo.partnerBirthTime = partnerBirthTimeInput.value || (partnerTimeUnknownBtn.classList.contains('active') ? '시간 모름' : '');
    }

    // 주문번호 생성 (신청서 이메일과 입금 알림 이메일을 서로 매칭하기 위한 용도)
    const orderId = 'DS-' + Date.now().toString(36).toUpperCase().slice(-4) + Math.random().toString(36).toUpperCase().slice(2, 5);
    basicInfo.orderId = orderId;

    localStorage.setItem('dalbitBasicInfo', JSON.stringify(basicInfo));

    location.href = '선택정보.html';
  });
</script>
</body>
</html>
